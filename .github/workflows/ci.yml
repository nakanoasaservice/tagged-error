name: CI
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version: "1.7.0"
          cache: true
          run-install: false

      - name: Verify declared Node.js runtime
        run: node -e 'const expected = require("./package.json").devEngines.runtime.version; if (process.versions.node !== expected) throw new Error(`Expected Node ${expected}, got ${process.version}`)'

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting, lint and types
        run: vp check

      - name: Run tests
        run: vp run test

      - name: Build packages
        run: vp pack

      - name: Check JSR package
        run: vp exec jsr publish --dry-run

      - name: Check npm package contents
        run: npm pack --dry-run
