version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Tokyo"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/"
    # Update the pinned Vite+ toolchain and setup-vp version together.
    ignore:
      - dependency-name: "vite"
      - dependency-name: "vite-plus"
      - dependency-name: "vitest"
      - dependency-name: "@voidzero-dev/vite-plus-core"
    schedule:
      interval: "weekly"
